# Template compose backend Node.js (Express/NestJS + MongoDB + Redis) — durci
# Secrets : .env (gitignore), jamais commites en clair ici.
# Placeholders: {{APP_NAME}} {{PORT}}

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: {{APP_NAME}}-api:local
    restart: unless-stopped
    env_file: .env
    ports:
      - "{{PORT}}:{{PORT}}"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  mongo:
    image: mongo:7
    restart: unless-stopped
    # ports NON publies en prod — reseau interne uniquement
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping: 1}).ok"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # ports NON publies en prod — reseau interne uniquement
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

volumes:
  mongo_data:
  redis_data:

networks:
  internal:
    driver: bridge
